
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리 지역 멘탈 충전소</title>

  <style>
    /* 전체 화면과 공통 스타일 */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Malgun Gothic', sans-serif;
      color: #253143;
    }

    button {
      cursor: pointer;
      font: inherit;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .5;
    }

    .app {
      display: flex;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      min-height: 450px;
    }

    /* 왼쪽 메뉴 영역 */
    .sidebar {
      width: 350px;
      flex: 0 0 350px;
      background: #fff;
      display: flex;
      flex-direction: column;
      box-shadow: 2px 0 12px #00000014;
      z-index: 2;
    }

    .header {
      padding: 23px 18px 18px;
      border-bottom: 1px solid #e5e9ef;
    }

    h1 {
      margin: 0 0 7px;
      font-size: 23px;
    }

    .description {
      font-size: 13px;
      margin: 0 0 20px;
      color: #66788a;
    }

    /* 도서관, 공원 탭 */
    .tabs {
      display: flex;
      gap: 8px;
    }

    .tab {
      flex: 1;
      padding: 12px 7px;
      border: 1px solid #d9e1e9;
      border-radius: 10px;
      background: #f7f9fb;
      font-weight: bold;
      font-size: 13px;
    }

    .tab.active {
      background: #e7f5ed;
      border-color: #469e71;
      color: #175e3b;
    }

    .tab:focus-visible,
    .result-button:focus-visible {
      outline: 3px solid #5299ff;
      outline-offset: -3px;
    }

    .status {
      padding: 12px 18px;
      font-size: 12px;
      line-height: 1.6;
      color: #526477;
      background: #f8fafc;
      border-bottom: 1px solid #e5e9ef;
    }

    /* 검색 결과 목록 */
    .result-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .result-item {
      border-bottom: 1px solid #edf0f3;
    }

    .result-button {
      width: 100%;
      padding: 15px 18px;
      background: white;
      border: none;
      text-align: left;
    }

    .result-button:hover {
      background: #f0faf4;
    }

    .place-name {
      display: block;
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .place-address,
    .place-phone {
      display: block;
      color: #617284;
      font-size: 12px;
      line-height: 1.5;
    }

    .empty {
      padding: 22px 18px;
      font-size: 13px;
      color: #6d7d8e;
      line-height: 1.7;
    }

    /* 오른쪽 지도 영역 */
    .map-panel {
      position: relative;
      flex: 1;
      min-width: 0;
    }

    #map {
      width: 100%;
      height: 100%;
      background: #e6edf1;
    }

    .my-location {
      position: absolute;
      z-index: 3;
      top: 16px;
      right: 16px;
      border: 0;
      border-radius: 9px;
      padding: 12px 16px;
      background: #fff;
      box-shadow: 0 2px 10px #0002;
      font-weight: bold;
    }

    /* 도서관 및 공원 이모지 마커 */
    .emoji-marker {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      background: white;
      border: 2px solid #5c9674;
      border-radius: 50%;
      box-shadow: 0 2px 8px #0003;
      font-size: 22px;
      cursor: pointer;
      user-select: none;
    }

    .emoji-marker:hover {
      transform: scale(1.12);
    }

    /* 사용자 현재 위치: 파란색 점 */
    .current-marker {
      width: 21px;
      height: 21px;
      background: #2583f5;
      border: 4px solid #fff;
      border-radius: 50%;
      box-shadow:
        0 0 0 8px #2583f533,
        0 2px 7px #0004;
    }

    /* 작은 화면에서는 위아래로 배치 */
    @media (max-width: 700px) {
      .app {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        flex: 0 0 43%;
        min-height: 230px;
      }

      .header {
        padding: 15px 14px;
      }

      h1 {
        font-size: 19px;
      }

      .description {
        margin-bottom: 12px;
      }

      .map-panel {
        min-height: 220px;
      }
    }
  </style>
</head>

<body>
  <main class="app">

    <!-- 왼쪽: 서비스 소개, 탭, 검색 결과 -->
    <section class="sidebar" aria-label="멘탈 충전소 목록">
      <div class="header">

        <h1>🌿 우리 지역 멘탈 충전소</h1>

        <p class="description">
          내 주변에서 마음을 쉬어 갈 장소를 찾아보세요.
        </p>

        <div class="tabs" aria-label="장소 유형 선택">
          <button
            id="libraryTab"
            class="tab"
            type="button"
            aria-pressed="false"
            disabled
          >
            실내에서 충전📚
          </button>

          <button
            id="parkTab"
            class="tab"
            type="button"
            aria-pressed="false"
            disabled
          >
            자연에서 충전🌳
          </button>
        </div>
      </div>

      <div
        id="status"
        class="status"
        role="status"
        aria-live="polite"
      >
        지도 로딩 중...
      </div>

      <ul id="resultList" class="result-list">
        <li class="empty">
          탭을 선택하면 주변 장소가 나타납니다.
        </li>
      </ul>
    </section>

    <!-- 오른쪽: 카카오 지도 및 현재 위치 버튼 -->
    <section class="map-panel" aria-label="카카오 지도">
      <div id="map"></div>

      <button
        id="locationButton"
        class="my-location"
        type="button"
        disabled
      >
        🔵 내 위치
      </button>
    </section>

  </main>

  <!-- 카카오 SDK를 지도 생성 전에 불러오기 -->
  <script
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=160b321a75a47e91bf4267942e3a7515&libraries=services&autoload=false"
    onerror="showSdkError()">
  </script>

  <script>
    // 화면 요소 가져오기
    const libraryTab = document.getElementById('libraryTab');
    const parkTab = document.getElementById('parkTab');
    const resultList = document.getElementById('resultList');
    const statusBox = document.getElementById('status');
    const locationButton = document.getElementById('locationButton');

    // 지도와 검색에 필요한 변수
    let map = null;
    let placesService = null;
    let infoWindow = null;
    let currentPosition = null;
    let currentOverlay = null;
    let placeOverlays = [];
    let activeType = null;
    let searchVersion = 0;
    let locationRequestVersion = 0;

    // 현재 위치를 사용할 수 없을 때 사용할 기본 좌표(서울시청)
    const defaultLatitude = 37.5665;
    const defaultLongitude = 126.9780;

    // 안내 메시지 바꾸기
    function setStatus(message) {
      statusBox.textContent = message;
    }

    // SDK 로딩 실패 안내
    function showSdkError() {
      setStatus(
        '지도를 불러오지 못했습니다. 카카오 앱 키와 등록된 웹 도메인을 확인해 주세요.'
      );
    }

    // 탭 선택 상태 표시
    function updateTabs(type) {
      libraryTab.classList.toggle(
        'active',
        type === 'library'
      );

      parkTab.classList.toggle(
        'active',
        type === 'park'
      );

      libraryTab.setAttribute(
        'aria-pressed',
        String(type === 'library')
      );

      parkTab.setAttribute(
        'aria-pressed',
        String(type === 'park')
      );
    }

    // 목록에 빈 상태 메시지 표시
    function showEmpty(message) {
      resultList.replaceChildren();

      const item = document.createElement('li');
      item.className = 'empty';
      item.textContent = message;

      resultList.appendChild(item);
    }

    // 기존 장소 마커와 정보창 제거
    // 파란색 내 위치 마커는 유지
    function clearPlaces() {
      placeOverlays.forEach(overlay => {
        overlay.setMap(null);
      });

      placeOverlays = [];

      if (infoWindow) {
        infoWindow.close();
      }

      resultList.replaceChildren();
    }

    // 정보창 내용을 안전하게 생성
    function createInfoContent(place) {
      const box = document.createElement('div');

      box.style.cssText =
        'padding:12px 15px;min-width:190px;max-width:270px;font-size:12px;line-height:1.7;overflow-wrap:anywhere;';

      // 장소 이름
      const name = document.createElement('strong');
      name.style.cssText =
        'display:block;font-size:14px;margin-bottom:5px;';

      name.textContent = place.place_name || '정보 없음';

      // 주소
      const address = document.createElement('div');

      address.textContent =
        '주소: ' +
        (place.road_address_name ||
         place.address_name ||
         '정보 없음');

      // 전화번호
      const phone = document.createElement('div');

      phone.textContent =
        '전화번호: ' + (place.phone || '정보 없음');

      box.append(name, address, phone);

      return box;
    }

    // 목록이나 이모지 마커를 클릭했을 때 정보창 표시
    function openPlace(place) {
      const position = new kakao.maps.LatLng(
        Number(place.y),
        Number(place.x)
      );

      // 선택한 장소를 지도 중심으로 이동
      map.panTo(position);

      // 장소 정보창 표시
      infoWindow.setContent(createInfoContent(place));
      infoWindow.setPosition(position);
      infoWindow.open(map);
    }

    // 장소별 이모지 마커와 왼쪽 목록 만들기
    function displayPlaces(places, type) {
      clearPlaces();

      const emoji = type === 'library' ? '📚' : '🌳';

      places.forEach(place => {
        const position = new kakao.maps.LatLng(
          Number(place.y),
          Number(place.x)
        );

        // 이모지 모양으로 보이는 클릭 가능한 마커 생성
        const markerElement = document.createElement('button');

        markerElement.type = 'button';
        markerElement.className = 'emoji-marker';
        markerElement.textContent = emoji;
        markerElement.title = place.place_name;

        markerElement.setAttribute(
          'aria-label',
          place.place_name + ' 정보 보기'
        );

        // 마커를 클릭하면 정보창 표시
        markerElement.addEventListener('click', () => {
          openPlace(place);
        });

        // 카카오맵에 커스텀 오버레이 추가
        const overlay = new kakao.maps.CustomOverlay({
          map: map,
          position: position,
          content: markerElement,
          yAnchor: 1.15,
          zIndex: 3
        });

        placeOverlays.push(overlay);

        // 왼쪽 검색 결과 목록 생성
        const item = document.createElement('li');
        item.className = 'result-item';

        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'result-button';

        // 장소 이름
        const name = document.createElement('span');
        name.className = 'place-name';

        name.textContent =
          emoji + ' ' + (place.place_name || '정보 없음');

        // 장소 주소
        const address = document.createElement('span');
        address.className = 'place-address';

        address.textContent =
          '주소: ' +
          (place.road_address_name ||
           place.address_name ||
           '정보 없음');

        // 장소 전화번호
        const phone = document.createElement('span');
        phone.className = 'place-phone';

        phone.textContent =
          '전화번호: ' + (place.phone || '정보 없음');

        button.append(name, address, phone);

        // 목록을 클릭해도 정보창 표시
        button.addEventListener('click', () => {
          openPlace(place);
        });

        item.appendChild(button);
        resultList.appendChild(item);
      });
    }

    // 선택한 탭에 따라 주변 도서관 또는 공원 검색
    function selectTab(type) {
      if (!map || !placesService) {
        return;
      }

      activeType = type;
      updateTabs(type);

      // 새로운 검색마다 번호를 증가시켜 이전 응답 무시
      searchVersion += 1;
      const thisSearch = searchVersion;

      // 탭을 바꾸는 즉시 이전 결과 제거
      clearPlaces();

      const keyword =
        type === 'library' ? '도서관' : '공원';

      // 내 위치가 없으면 현재 지도 중심 사용
      const center = currentPosition || map.getCenter();

      showEmpty(keyword + ' 검색 중...');

      setStatus(
        '내 주변 ' + keyword + '을(를) 찾고 있습니다...'
      );

      // 현재 위치 중심 반경 5km, 거리순 최대 15개 검색
      placesService.keywordSearch(
        keyword,

        (data, status) => {
          // 탭을 빠르게 바꿨을 때 이전 요청의 응답 무시
          if (thisSearch !== searchVersion) {
            return;
          }

          if (status === kakao.maps.services.Status.OK) {
            displayPlaces(data, type);

            setStatus(
              '주변 ' + keyword + ' ' +
              data.length +
              '곳을 표시했습니다. (반경 5km, 최대 15곳)'
            );

          } else if (
            status === kakao.maps.services.Status.ZERO_RESULT
          ) {
            showEmpty(
              '주변 5km 내 검색된 ' +
              keyword + '이(가) 없습니다.'
            );

            setStatus('검색 결과가 없습니다.');

          } else {
            showEmpty(
              '검색에 실패했습니다. 탭을 다시 눌러 주세요.'
            );

            setStatus('장소 검색 중 오류가 발생했습니다.');
          }
        },

        {
          location: center,
          radius: 5000,
          sort: kakao.maps.services.SortBy.DISTANCE,
          size: 15
        }
      );
    }

    // 파란색 원으로 내 현재 위치 표시
    function showCurrentPosition(position) {
      if (currentOverlay) {
        currentOverlay.setMap(null);
      }

      const blueDot = document.createElement('div');

      blueDot.className = 'current-marker';
      blueDot.title = '내 현재 위치';

      currentOverlay = new kakao.maps.CustomOverlay({
        map: map,
        position: position,
        content: blueDot,
        zIndex: 5
      });
    }

    // 위치 권한 요청 후 현재 위치를 지도 중심으로 이동
    function moveToMyLocation() {
      if (!map) {
        return;
      }

      // 브라우저가 위치 기능을 지원하는지 확인
      if (!navigator.geolocation) {
        setStatus(
          '브라우저가 위치 기능을 지원하지 않습니다. 기본 위치에서 검색해 주세요.'
        );
        return;
      }

      const thisRequest = ++locationRequestVersion;

      setStatus(
        '현재 위치를 확인하고 있습니다. 위치 권한을 허용해 주세요.'
      );

      navigator.geolocation.getCurrentPosition(
        position => {
          if (thisRequest !== locationRequestVersion) {
            return;
          }

          // 현재 위치 좌표 만들기
          currentPosition = new kakao.maps.LatLng(
            position.coords.latitude,
            position.coords.longitude
          );

          // 현재 위치로 지도 이동
          map.setCenter(currentPosition);

          // 지도 확대 레벨 5
          map.setLevel(5);

          // 파란색 위치 표시
          showCurrentPosition(currentPosition);

          setStatus(
            '파란색 점이 현재 위치입니다. 충전소 탭을 선택해 보세요.'
          );

          // 이미 선택한 탭이 있다면 새 위치 기준으로 검색
          if (activeType) {
            selectTab(activeType);
          }
        },

        // 위치 접근을 허용하지 않았거나 실패한 경우
        error => {
          if (thisRequest !== locationRequestVersion) {
            return;
          }

          const reason = error.code === 1
            ? '위치 권한이 거부되었습니다.'
            : '현재 위치를 확인하지 못했습니다.';

          setStatus(
            reason +
            ' 기본 위치(서울시청)를 중심으로 검색할 수 있습니다.'
          );
        },

        {
          enableHighAccuracy: true,
          timeout: 12000,
          maximumAge: 60000
        }
      );
    }

    // 도서관 탭 클릭
    libraryTab.addEventListener('click', () => {
      selectTab('library');
    });

    // 공원 탭 클릭
    parkTab.addEventListener('click', () => {
      selectTab('park');
    });

    // 내 위치 버튼 클릭
    locationButton.addEventListener('click', moveToMyLocation);

    // 카카오 SDK가 모두 준비된 뒤 지도와 검색 서비스 생성
    if (
      window.kakao &&
      kakao.maps &&
      typeof kakao.maps.load === 'function'
    ) {
      kakao.maps.load(() => {

        // 장소 검색 라이브러리 확인
        if (
          !kakao.maps.services ||
          !kakao.maps.services.Places
        ) {
          setStatus(
            '장소 검색 라이브러리를 불러오지 못했습니다.'
          );
          return;
        }

        // 지도 생성: 최초 기본 중심은 서울시청
        map = new kakao.maps.Map(
          document.getElementById('map'),
          {
            center: new kakao.maps.LatLng(
              defaultLatitude,
              defaultLongitude
            ),
            level: 5
          }
        );

        // 장소 검색 서비스 객체 생성
        placesService = new kakao.maps.services.Places();

        // 장소 정보창 생성
        infoWindow = new kakao.maps.InfoWindow({
          zIndex: 6,
          removable: true
        });

        // 지도 준비 완료 후 버튼 활성화
        libraryTab.disabled = false;
        parkTab.disabled = false;
        locationButton.disabled = false;

        // 페이지가 열리면 현재 위치 권한 요청
        moveToMyLocation();
      });

    } else {
      showSdkError();
    }
  </script>
</body>
</html>

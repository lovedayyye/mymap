<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카카오맵 장소 검색 서비스</title>

  <!-- CSS 스타일 정의 -->
  <style>
    /* 전체 페이지 리셋 및 기본 설정 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
    }

    /* 화면 전체를 좌우로 분할하는 컨테이너 */
    .app-container {
      display: flex;
      width: 100vw;
      height: 100vh;
    }

    /* 왼쪽 패널: 검색 영역 및 결과 리스트 */
    .sidebar {
      width: 380px;
      height: 100%;
      background-color: #ffffff;
      border-right: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      z-index: 10;
      box-shadow: 2px 0 8px rgba(0, 0, 0, 0.05);
    }

    /* 검색창 영역 */
    .search-box {
      padding: 20px;
      background-color: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
    }

    .search-title {
      font-size: 1.2rem;
      font-weight: bold;
      color: #1e293b;
      margin-bottom: 12px;
    }

    .search-form {
      display: flex;
      gap: 8px;
    }

    .search-input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: #2563eb;
    }

    .search-button {
      padding: 10px 16px;
      background-color: #fee500; /* 카카오 대표 노란색 */
      color: #191919;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .search-button:hover {
      background-color: #fada0a;
    }

    /* 결과 목록 영역 (스크롤 가능) */
    .result-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
    }

    .result-item {
      padding: 16px 20px;
      border-bottom: 1px solid #f1f5f9;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .result-item:hover {
      background-color: #f8fafc;
    }

    .place-name {
      font-size: 15px;
      font-weight: bold;
      color: #0f172a;
      margin-bottom: 4px;
    }

    .place-address {
      font-size: 13px;
      color: #64748b;
    }

    .place-phone {
      font-size: 12px;
      color: #10b981;
      margin-top: 4px;
    }

    /* 안내 및 로딩 상태 메세지 */
    .status-message {
      padding: 20px;
      text-align: center;
      color: #64748b;
      font-size: 14px;
    }

    /* 오른쪽 영역: 지도 */
    .map-container {
      flex: 1;
      height: 100%;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
    }
  </style>

  <!-- 카카오맵 JavaScript API 스크립트 로드 -->
  <!-- libraries=services 파라미터를 추가해야 장소 검색 키워드(Places) 기능이 활성화됩니다. -->
  <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=160b321a75a47e91bf4267942e3a7515&libraries=services"></script>
</head>
<body>

  <!-- 전체 레이아웃 구성을 위한 컨테이너 -->
  <div class="app-container">
    
    <!-- 왼쪽: 검색창 및 결과 영역 -->
    <aside class="sidebar">
      <div class="search-box">
        <h1 class="search-title">📍 장소 검색</h1>
        <form class="search-form" id="searchForm">
          <input type="text" id="keywordInput" class="search-input" placeholder="예: 강남역 맛집, 카페" required>
          <button type="submit" class="search-button">검색</button>
        </form>
      </div>

      <!-- 검색 결과 목록 -->
      <ul id="resultList" class="result-list">
        <li class="status-message">현재 위치를 불러오는 중입니다...</li>
      </ul>
    </aside>

    <!-- 오른쪽: 카카오 지도 영역 -->
    <main class="map-container">
      <div id="map"></div>
    </main>

  </div>

  <!-- JavaScript 동작 구현 -->
  <script>
    // 주요 변수 선언 (전역 변수)
    let mapObject = null;           // 지도 객체
    let placesService = null;       // 장소 검색 서비스 객체
    let infoWindow = null;          // 마커 클릭 시 표시할 인포윈도우
    let markersArray = [];          // 생성된 마커들을 관리하는 배열

    // 지도 로딩 오류를 방지하기 위해 kakao.maps.load() 구문 사용
    kakao.maps.load(function () {
      initApp();
    });

    /**
     * 앱 초기화 함수: 지도 및 서비스 세팅, 현재 위치 가져오기
     */
    function initApp() {
      const mapContainer = document.getElementById('map');
      
      // 기본 중심 좌표 (위치 권한을 거부하거나 오류 발생 시 표시할 기본 위치: 서울시청)
      const defaultCenter = new kakao.maps.LatLng(37.566826, 126.9786567);
      
      const mapOptions = {
        center: defaultCenter,
        level: 5 // 요구사항: 지도 확대 레벨 5
      };

      // 지도 생성
      mapObject = new kakao.maps.Map(mapContainer, mapOptions);

      // 장소 검색 서비스 객체 생성
      placesService = new kakao.maps.services.Places();

      // 공용 인포윈도우 생성
      infoWindow = new kakao.maps.InfoWindow({ zIndex: 1 });

      // 사용자 현재 위치 확인 실행
      getUserLocation();

      // 검색 폼 제출 이벤트 등록
      const searchForm = document.getElementById('searchForm');
      searchForm.addEventListener('submit', function (event) {
        event.preventDefault(); // 기본 폼 제출 동작 방지
        executeSearch();
      });
    }

    /**
     * 사용자 위치 권한 요청 및 현재 위치 지도 반영
     */
    function getUserLocation() {
      const resultListElement = document.getElementById('resultList');

      // 브라우저가 Geolocation을 지원하는지 확인
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          function (position) {
            const currentLat = position.coords.latitude;
            const currentLng = position.coords.longitude;
            const currentPosition = new kakao.maps.LatLng(currentLat, currentLng);

            // 지도 중심을 현재 위치로 이동
            mapObject.setCenter(currentPosition);

            // 현재 위치를 알리는 마커 표시
            const currentLocationMarker = new kakao.maps.Marker({
              position: currentPosition,
              map: mapObject
            });

            // 현재 위치 마커 안내 메시지
            const locationInfo = new kakao.maps.InfoWindow({
              content: '<div style="padding:5px;font-size:12px;color:#2563eb;font-weight:bold;">📍 현재 위치</div>'
            });
            locationInfo.open(mapObject, currentLocationMarker);

            resultListElement.innerHTML = '<li class="status-message">검색어를 입력하고 검색 버튼을 누르세요.</li>';
          },
          function (error) {
            console.warn('위치 정보를 가져올 수 없습니다:', error.message);
            resultListElement.innerHTML = '<li class="status-message">위치 권한을 거부했거나 가져올 수 없습니다.<br>기본 위치(서울시청)로 설정됩니다.</li>';
          }
        );
      } else {
        resultListElement.innerHTML = '<li class="status-message">이 브라우저에서는 위치 서비스를 지원하지 않습니다.</li>';
      }
    }

    /**
     * 입력된 키워드로 장소 검색 실행
     */
    function executeSearch() {
      const keywordInput = document.getElementById('keywordInput');
      const keyword = keywordInput.value.trim();

      if (!keyword) {
        alert('검색어를 입력해 주세요!');
        return

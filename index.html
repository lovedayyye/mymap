
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카카오맵 장소 검색</title>

  <style>
    /* 전체 화면 설정 */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Malgun Gothic', sans-serif;
      color: #172331;
      background: #f5f7fb;
    }

    /* 왼쪽 검색 영역과 오른쪽 지도를 나란히 배치 */
    .app {
      display: flex;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      min-height: 420px;
    }

    /* 왼쪽 검색 영역 */
    .sidebar {
      width: 360px;
      flex: 0 0 360px;
      display: flex;
      flex-direction: column;
      background: white;
      box-shadow: 2px 0 14px #152b4415;
      z-index: 2;
    }

    .header {
      padding: 24px 20px 14px;
      border-bottom: 1px solid #edf0f3;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 23px;
    }

    .description {
      margin: 0 0 18px;
      font-size: 13px;
      color: #64748b;
    }

    /* 검색창과 검색 버튼 */
    .search-form {
      display: flex;
      gap: 8px;
    }

    .search-input {
      min-width: 0;
      flex: 1;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 14px;
      padding: 12px;
      outline-offset: 2px;
    }

    button {
      cursor: pointer;
      border: 0;
      border-radius: 9px;
      font-weight: 700;
    }

    .search-button {
      background: #fee500;
      padding: 0 16px;
      color: #272727;
    }

    .status {
      padding: 12px 20px;
      font-size: 12px;
      color: #526477;
      border-bottom: 1px solid #edf0f3;
      line-height: 1.5;
    }

    /* 검색 결과 목록 */
    .result-list {
      overflow-y: auto;
      flex: 1;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .result-item {
      border-bottom: 1px solid #edf0f3;
    }

    .result-button {
      display: block;
      width: 100%;
      padding: 17px 20px;
      background: white;
      text-align: left;
      border-radius: 0;
    }

    .result-button:hover,
    .result-button:focus-visible {
      background: #fffce5;
    }

    .place-name {
      display: block;
      margin-bottom: 5px;
      font-size: 15px;
      font-weight: 700;
    }

    .place-category {
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
      color: #587093;
    }

    .place-address {
      display: block;
      font-size: 12px;
      color: #66778a;
      line-height: 1.5;
    }

    .empty {
      padding: 26px 20px;
      color: #77869a;
      font-size: 14px;
      line-height: 1.7;
    }

    /* 오른쪽 지도 영역 */
    .map-panel {
      position: relative;
      flex: 1;
      min-width: 0;
    }

    #map {
      width: 100%;
      height: 100%;
      background: #e8edf3;
    }

    /* 내 위치로 이동하는 버튼 */
    .my-location {
      position: absolute;
      z-index: 3;
      top: 16px;
      right: 16px;
      padding: 12px 15px;
      background: white;
      box-shadow: 0 2px 12px #0002;
    }

    .my-location:hover {
      background: #f3f6fa;
    }

    /* 작은 화면에서는 위아래로 배치 */
    @media (max-width: 700px) {
      .app {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        flex: 0 0 43%;
        min-height: 220px;
      }

      .header {
        padding: 14px 16px 10px;
      }

      h1 {
        font-size: 19px;
      }

      .description {
        margin-bottom: 10px;
      }

      .status {
        padding: 8px 16px;
      }

      .map-panel {
        min-height: 200px;
      }
    }
  </style>
</head>

<body>
  <main class="app">

    <!-- 왼쪽: 검색창과 결과 목록 -->
    <section class="sidebar" aria-label="장소 검색 영역">
      <div class="header">
        <h1>📍 장소 찾기</h1>
        <p class="description">가고 싶은 장소를 검색해 보세요.</p>

        <form id="searchForm" class="search-form">
          <input
            id="keyword"
            class="search-input"
            type="search"
            placeholder="예: 근처 카페, 경복궁"
            aria-label="장소 검색어"
            required
          >
          <button
            id="searchButton"
            class="search-button"
            type="submit"
            disabled
          >
            검색
          </button>
        </form>
      </div>

      <div id="status" class="status" role="status" aria-live="polite">
        지도를 불러오는 중입니다...
      </div>

      <ul id="resultList" class="result-list">
        <li class="empty">
          검색하면 이곳에 장소 목록이 나타납니다.
        </li>
      </ul>
    </section>

    <!-- 오른쪽: 카카오맵 -->
    <section class="map-panel" aria-label="카카오 지도 영역">
      <div id="map" aria-label="지도"></div>

      <button
        id="locationButton"
        class="my-location"
        type="button"
        disabled
      >
        ◎ 내 위치
      </button>
    </section>

  </main>

  <!-- 장소 검색에 필요한 services 라이브러리 불러오기 -->
  <!-- autoload=false로 SDK 로딩 완료 후 지도 실행 -->
  <script
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=160b321a75a47e91bf4267942e3a7515&libraries=services&autoload=false"
    onerror="showSdkError()">
  </script>

  <script>
    // HTML 요소 가져오기
    const searchForm = document.getElementById('searchForm');
    const keywordInput = document.getElementById('keyword');
    const resultList = document.getElementById('resultList');
    const statusBox = document.getElementById('status');
    const searchButton = document.getElementById('searchButton');
    const locationButton = document.getElementById('locationButton');

    // 지도 관련 변수
    let map = null;
    let placesService = null;
    let infoWindow = null;
    let searchMarkers = [];
    let currentMarker = null;
    let currentPosition = null;

    // 상태 메시지 표시
    function setStatus(message) {
      statusBox.textContent = message;
    }

    // 지도 SDK를 불러오지 못한 경우
    function showSdkError() {
      setStatus(
        '지도 SDK를 불러오지 못했습니다. 카카오 앱 키와 허용 도메인을 확인하세요.'
      );
    }

    // 이전 검색 결과의 마커 제거
    function clearSearchMarkers() {
      searchMarkers.forEach(marker => marker.setMap(null));
      searchMarkers = [];

      if (infoWindow) {
        infoWindow.close();
      }
    }

    // 선택한 장소로 지도 이동
    function openPlace(place, marker) {
      const position = new kakao.maps.LatLng(
        Number(place.y),
        Number(place.x)
      );

      map.panTo(position);

      // 장소 이름을 안전하게 표시
      const content = document.createElement('div');

      content.style.cssText =
        'padding:9px 12px;font-size:13px;min-width:130px;max-width:240px;overflow-wrap:anywhere;';

      content.textContent = place.place_name;

      infoWindow.setContent(content);
      infoWindow.open(map, marker);
    }

    // 검색 결과를 목록과 지도에 표시
    function displayPlaces(data) {
      clearSearchMarkers();
      resultList.replaceChildren();

      const bounds = new kakao.maps.LatLngBounds();

      data.forEach(place => {
        const position = new kakao.maps.LatLng(
          Number(place.y),
          Number(place.x)
        );

        // 지도에 장소 마커 생성
        const marker = new kakao.maps.Marker({
          map: map,
          position: position
        });

        searchMarkers.push(marker);
        bounds.extend(position);

        // 검색 결과 목록 생성
        const item = document.createElement('li');
        item.className = 'result-item';

        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'result-button';

        const name = document.createElement('span');
        name.className = 'place-name';
        name.textContent = place.place_name;

        const category = document.createElement('span');
        category.className = 'place-category';
        category.textContent = place.category_name || '장소';

        const address = document.createElement('span');
        address.className = 'place-address';
        address.textContent =
          place.road_address_name ||
          place.address_name ||
          '주소 정보 없음';

        button.append(name, category, address);
        item.appendChild(button);
        resultList.appendChild(item);

        // 목록을 클릭하면 해당 장소로 이동
        button.addEventListener('click', () => {
          openPlace(place, marker);
        });

        // 지도 마커를 클릭하면 장소 정보 표시
        kakao.maps.event.addListener(marker, 'click', () => {
          openPlace(place, marker);
        });
      });

      // 검색된 장소가 모두 보이도록 지도 범위 조정
      if (data.length > 0) {
        map.setBounds(bounds);
      }

      setStatus(`검색 결과 ${data.length}개를 표시했습니다.`);
    }

    // 키워드로 장소 검색
    function searchPlaces() {
      if (!placesService || !map) {
        return;
      }

      const keyword = keywordInput.value.trim();

      if (!keyword) {
        setStatus('검색어를 입력해 주세요.');
        keywordInput.focus();
        return;
      }

      setStatus('장소를 검색하고 있습니다...');

      placesService.keywordSearch(keyword, (data, status) => {
        if (status === kakao.maps.services.Status.OK) {
          displayPlaces(data);

        } else if (
          status === kakao.maps.services.Status.ZERO_RESULT
        ) {
          clearSearchMarkers();
          resultList.replaceChildren();

          const empty = document.createElement('li');
          empty.className = 'empty';
          empty.textContent =
            '검색 결과가 없습니다. 다른 검색어를 입력해 보세요.';

          resultList.appendChild(empty);
          setStatus('검색 결과가 없습니다.');

        } else {
          setStatus(
            '장소 검색에 실패했습니다. 잠시 후 다시 시도해 주세요.'
          );
        }
      });
    }

    // 현재 위치 가져오기
    function moveToMyLocation() {
      if (!map) {
        return;
      }

      // 브라우저 위치 기능 지원 여부 확인
      if (!navigator.geolocation) {
        setStatus(
          '이 브라우저에서는 위치 기능을 지원하지 않습니다.'
        );
        return;
      }

      setStatus('현재 위치 권한을 확인하고 있습니다...');

      navigator.geolocation.getCurrentPosition(
        position => {
          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;

          // 현재 위치 좌표 생성
          currentPosition = new kakao.maps.LatLng(
            latitude,
            longitude
          );

          // 현재 위치를 중심으로 지도 이동
          map.setCenter(currentPosition);

          // 지도 확대 레벨 5
          map.setLevel(5);

          // 이전 내 위치 마커 제거
          if (currentMarker) {
            currentMarker.setMap(null);
          }

          // 현재 위치 마커 생성
          currentMarker = new kakao.maps.Marker({
            map: map,
            position: currentPosition,
            title: '내 현재 위치'
          });

          setStatus(
            '현재 위치를 중심으로 지도를 표시했습니다. 장소를 검색해 보세요.'
          );
        },

        // 위치 권한 거부 또는 위치 확인 실패
        error => {
          const message = error.code === 1
            ? '위치 권한이 거부되어 기본 위치(서울시청)를 표시합니다.'
            : '위치를 확인하지 못해 기본 위치(서울시청)를 표시합니다.';

          setStatus(
            message + ' 장소 검색은 정상적으로 사용할 수 있습니다.'
          );
        },

        {
          enableHighAccuracy: true,
          timeout: 12000,
          maximumAge: 60000
        }
      );
    }

    // 검색 버튼 또는 Enter 키 입력
    searchForm.addEventListener('submit', event => {
      event.preventDefault();
      searchPlaces();
    });

    // 내 위치 버튼 클릭
    locationButton.addEventListener('click', moveToMyLocation);

    // 카카오 SDK가 로드되었는지 확인
    if (
      window.kakao &&
      kakao.maps &&
      typeof kakao.maps.load === 'function'
    ) {
      // SDK 준비가 완료된 후에만 지도 생성
      kakao.maps.load(() => {

        // 장소 검색 라이브러리 확인
        if (
          !kakao.maps.services ||
          !kakao.maps.services.Places
        ) {
          setStatus(
            '장소 검색 라이브러리를 불러오지 못했습니다.'
          );
          return;
        }

        // 지도 생성: 기본 위치는 서울시청
        map = new kakao.maps.Map(
          document.getElementById('map'),
          {
            center: new kakao.maps.LatLng(
              37.5665,
              126.9780
            ),
            level: 5
          }
        );

        // 장소 검색 객체 생성
        placesService = new kakao.maps.services.Places();

        // 장소 정보창 생성
        infoWindow = new kakao.maps.InfoWindow({
          zIndex: 2
        });

        // 지도 준비가 끝나면 버튼 활성화
        searchButton.disabled = false;
        locationButton.disabled = false;

        setStatus(
          '지도 준비 완료. 현재 위치를 확인합니다...'
        );

        // 페이지가 열리면 현재 위치 확인
        moveToMyLocation();
      });

    } else {
      showSdkError();
    }
  </script>
</body>
</html>


<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리 지역 멘탈 충전소</title>

  <style>
    /* 전체 화면과 기본 글꼴 */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Malgun Gothic', sans-serif;
      color: #263448;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* 왼쪽과 오른쪽 화면 분할 */
    .app {
      display: flex;
      height: 100vh;
      height: 100dvh;
      min-height: 480px;
    }

    /* 왼쪽 검색 영역 */
    .sidebar {
      width: 370px;
      flex: 0 0 370px;
      display: flex;
      flex-direction: column;
      background: #fff;
      box-shadow: 2px 0 15px #0001;
      z-index: 2;
    }

    .header {
      padding: 22px 18px 15px;
      border-bottom: 1px solid #edf0f3;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 23px;
    }

    .description {
      margin: 0 0 18px;
      color: #64748b;
      font-size: 13px;
      line-height: 1.6;
    }

    .section-label {
      margin: 14px 0 8px;
      font-size: 12px;
      font-weight: 700;
      color: #536578;
    }

    /* 실내 충전과 자연 충전 탭 */
    .tabs {
      display: flex;
      gap: 8px;
    }

    .tab {
      flex: 1;
      padding: 12px 5px;
      border: 1px solid #d8e2e8;
      border-radius: 10px;
      background: #f8fafb;
      font-size: 13px;
      font-weight: bold;
    }

    .tab.active {
      border-color: #4b986c;
      background: #e6f6eb;
      color: #176239;
    }

    /* 고양시 지역 선택 버튼 */
    .regions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
    }

    .region {
      padding: 10px 7px;
      border: 1px solid #d8e2e8;
      border-radius: 9px;
      background: white;
      font-size: 12px;
      font-weight: 600;
    }

    .region.active {
      background: #eaf1ff;
      color: #245cbb;
      border-color: #6c9de8;
    }

    button:focus-visible {
      outline: 3px solid #55a7fb;
      outline-offset: 2px;
    }

    /* 상태 메시지 */
    .status {
      padding: 12px 18px;
      color: #536578;
      background: #f8fafb;
      border-bottom: 1px solid #edf0f3;
      font-size: 12px;
      line-height: 1.6;
    }

    /* 검색 결과 목록 */
    .result-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .result-item {
      border-bottom: 1px solid #eef1f4;
    }

    .result-button {
      width: 100%;
      padding: 15px 18px;
      text-align: left;
      border: 0;
      background: white;
    }

    .result-button:hover {
      background: #f1fbf4;
    }

    .place-name {
      display: block;
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .place-detail {
      display: block;
      font-size: 12px;
      color: #64748b;
      line-height: 1.6;
    }

    .empty {
      padding: 22px 18px;
      color: #64748b;
      font-size: 13px;
      line-height: 1.7;
    }

    /* 오른쪽 지도 영역 */
    .map-panel {
      position: relative;
      flex: 1;
      min-width: 0;
    }

    #map {
      width: 100%;
      height: 100%;
      background: #e6edf1;
    }

    /* 현재 위치로 이동하는 버튼 */
    .my-location {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 3;
      border: 0;
      border-radius: 9px;
      background: white;
      padding: 12px 15px;
      box-shadow: 0 2px 10px #0002;
      font-weight: 700;
    }

    /* 도서관과 공원 이모지 마커 */
    .emoji-marker {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 39px;
      height: 39px;
      border: 2px solid #5c9674;
      border-radius: 50%;
      background: white;
      font-size: 22px;
      box-shadow: 0 2px 8px #0003;
    }

    /* 현재 위치를 표시하는 파란색 점 */
    .current-marker {
      width: 21px;
      height: 21px;
      border: 4px solid white;
      border-radius: 50%;
      background: #2688f5;
      box-shadow:
        0 0 0 8px #2688f533,
        0 2px 7px #0003;
    }

    /* 모바일 화면 설정 */
    @media (max-width: 700px) {
      .app {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        flex: 0 0 49%;
        min-height: 270px;
      }

      .header {
        padding: 12px 14px;
      }

      h1 {
        font-size: 19px;
      }

      .description {
        margin-bottom: 8px;
      }

      .section-label {
        margin: 9px 0 6px;
      }

      .tab,
      .region {
        padding: 8px 5px;
      }

      .map-panel {
        min-height: 200px;
      }
    }
  </style>
</head>

<body>
  <main class="app">

    <!-- 왼쪽: 장소 유형, 지역 선택, 결과 목록 -->
    <section class="sidebar" aria-label="멘탈 충전소 검색">

      <div class="header">
        <h1>🌿 우리 지역 멘탈 충전소</h1>

        <p class="description">
          고양시에서 마음을 쉬어 갈 장소를 찾아보세요.
        </p>

        <!-- 장소 유형 선택 -->
        <div class="section-label">
          어디에서 충전할까요?
        </div>

        <div class="tabs" aria-label="충전 장소 유형">
          <button
            class="tab active"
            id="libraryTab"
            type="button"
            aria-pressed="true"
            disabled
          >
            실내에서 충전📚
          </button>

          <button
            class="tab"
            id="parkTab"
            type="button"
            aria-pressed="false"
            disabled
          >
            자연에서 충전🌳
          </button>
        </div>

        <!-- 지역 선택 -->
        <div class="section-label">
          어느 지역에서 찾을까요?
        </div>

        <div class="regions" aria-label="고양시 지역 선택">

          <button
            class="region active"
            data-region="all"
            type="button"
            aria-pressed="true"
            disabled
          >
            고양시 전체
          </button>

          <button
            class="region"
            data-region="일산동구"
            type="button"
            aria-pressed="false"
            disabled
          >
            일산동구
          </button>

          <button
            class="region"
            data-region="일산서구"
            type="button"
            aria-pressed="false"
            disabled
          >
            일산서구
          </button>

          <button
            class="region"
            data-region="덕양구"
            type="button"
            aria-pressed="false"
            disabled
          >
            덕양구
          </button>

        </div>
      </div>

      <!-- 검색 진행 상태 -->
      <div
        class="status"
        id="status"
        role="status"
        aria-live="polite"
      >
        지도 준비 중...
      </div>

      <!-- 검색 결과가 표시되는 곳 -->
      <ul class="result-list" id="resultList">
        <li class="empty">
          지도 준비가 완료되면 검색 결과가 나타납니다.
        </li>
      </ul>
    </section>

    <!-- 오른쪽: 카카오 지도 -->
    <section class="map-panel" aria-label="카카오 지도">
      <div id="map"></div>

      <button
        class="my-location"
        id="locationButton"
        type="button"
        disabled
      >
        🔵 내 위치
      </button>
    </section>

  </main>

  <!-- 카카오맵 SDK와 장소 검색 라이브러리 -->
  <script
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=160b321a75a47e91bf4267942e3a7515&libraries=services&autoload=false"
    onerror="showSdkError()">
  </script>

  <script>
    // 화면 요소 가져오기
    const libraryTab = document.getElementById('libraryTab');
    const parkTab = document.getElementById('parkTab');

    const regionButtons = Array.from(
      document.querySelectorAll('[data-region]')
    );

    const locationButton = document.getElementById('locationButton');
    const resultList = document.getElementById('resultList');
    const statusBox = document.getElementById('status');

    // 지도와 장소 검색에 필요한 변수
    let map = null;
    let placesService = null;
    let infoWindow = null;

    let currentPosition = null;
    let currentOverlay = null;
    let placeOverlays = [];

    // 기본 선택: 도서관, 고양시 전체
    let activeType = 'library';
    let activeRegion = 'all';

    // 이전 검색 결과가 섞이지 않도록 관리
    let searchVersion = 0;
    let locationVersion = 0;

    // 고양시의 3개 행정구
    const districts = [
      '일산동구',
      '일산서구',
      '덕양구'
    ];

    // 상태 메시지 표시
    function setStatus(message) {
      statusBox.textContent = message;
    }

    // SDK 로딩 오류 안내
    function showSdkError() {
      setStatus(
        '카카오맵을 불러오지 못했습니다. 앱 키와 웹 도메인을 확인해 주세요.'
      );
    }

    // 현재 선택된 버튼 강조 표시
    function updateButtons() {

      libraryTab.classList.toggle(
        'active',
        activeType === 'library'
      );

      parkTab.classList.toggle(
        'active',
        activeType === 'park'
      );

      libraryTab.setAttribute(
        'aria-pressed',
        String(activeType === 'library')
      );

      parkTab.setAttribute(
        'aria-pressed',
        String(activeType === 'park')
      );

      // 지역 선택 버튼에도 강조 표시
      regionButtons.forEach(button => {
        const selected =
          button.dataset.region === activeRegion;

        button.classList.toggle('active', selected);

        button.setAttribute(
          'aria-pressed',
          String(selected)
        );
      });
    }

    // 검색 결과가 없을 때 안내 메시지 표시
    function showEmpty(message) {
      resultList.replaceChildren();

      const item = document.createElement('li');
      item.className = 'empty';
      item.textContent = message;

      resultList.appendChild(item);
    }

    // 기존 장소 마커 및 목록 삭제
    // 현재 위치 파란색 마커는 유지
    function clearPlaces() {

      placeOverlays.forEach(overlay => {
        overlay.setMap(null);
      });

      placeOverlays = [];

      if (infoWindow) {
        infoWindow.close();
      }

      resultList.replaceChildren();
    }

    // 장소 주소에서 고양시 행정구 확인
    function getDistrict(place) {

      const address =
        place.address_name ||
        place.road_address_name ||
        '';

      const match = address.match(
        /(?:^|\s)고양시\s+(일산동구|일산서구|덕양구)(?:\s|$)/
      );

      return match ? match[1] : null;
    }

    // 장소 주소 가져오기
    function getAddress(place) {
      return (
        place.road_address_name ||
        place.address_name ||
        '정보 없음'
      );
    }

    // 장소 정보창 만들기
    function createInfoContent(place) {

      const box = document.createElement('div');

      box.style.cssText =
        'padding:12px 15px;min-width:195px;max-width:275px;font-size:12px;line-height:1.7;overflow-wrap:anywhere;';

      // 장소 이름
      const name = document.createElement('strong');

      name.style.cssText =
        'display:block;font-size:14px;margin-bottom:5px;';

      name.textContent =
        place.place_name || '정보 없음';

      // 장소 주소
      const address = document.createElement('div');

      address.textContent =
        '주소: ' + getAddress(place);

      // 전화번호
      const phone = document.createElement('div');

      phone.textContent =
        '전화번호: ' + (place.phone || '정보 없음');

      box.append(name, address, phone);

      return box;
    }

    // 마커를 클릭하면 장소 정보창 표시
    function openPlace(place) {

      const position = new kakao.maps.LatLng(
        Number(place.y),
        Number(place.x)
      );

      // 해당 장소로 지도 이동
      map.panTo(position);

      // 작은 정보창 표시
      infoWindow.setContent(createInfoContent(place));
      infoWindow.setPosition(position);
      infoWindow.open(map);
    }

    // 검색 결과를 지도와 왼쪽 목록에 표시
    function displayPlaces(places) {

      clearPlaces();

      // 도서관과 공원별 마커 구분
      const emoji =
        activeType === 'library' ? '📚' : '🌳';

      const bounds = new kakao.maps.LatLngBounds();

      places.forEach(place => {

        const position = new kakao.maps.LatLng(
          Number(place.y),
          Number(place.x)
        );

        bounds.extend(position);

        // 이모지 마커 버튼 생성
        const markerButton = document.createElement('button');

        markerButton.type = 'button';
        markerButton.className = 'emoji-marker';
        markerButton.textContent = emoji;
        markerButton.title = place.place_name;

        markerButton.setAttribute(
          'aria-label',
          place.place_name + ' 정보 보기'
        );

        // 마커 클릭 시 정보창 표시
        markerButton.addEventListener('click', () => {
          openPlace(place);
        });

        // 지도 위에 이모지 마커 표시
        const overlay = new kakao.maps.CustomOverlay({
          map: map,
          position: position,
          content: markerButton,
          yAnchor: 1.1,
          zIndex: 3
        });

        placeOverlays.push(overlay);

        // 왼쪽 장소 목록 생성
        const item = document.createElement('li');
        item.className = 'result-item';

        const button = document.createElement('button');
        button.className = 'result-button';
        button.type = 'button';

        // 장소 이름
        const name = document.createElement('span');
        name.className = 'place-name';

        name.textContent =
          emoji + ' ' + (place.place_name || '정보 없음');

        // 장소 주소
        const address = document.createElement('span');
        address.className = 'place-detail';

        address.textContent =
          '주소: ' + getAddress(place);

        // 전화번호
        const phone = document.createElement('span');
        phone.className = 'place-detail';

        phone.textContent =
          '전화번호: ' + (place.phone || '정보 없음');

        button.append(name, address, phone);

        // 장소 목록 클릭 시 정보창 표시
        button.addEventListener('click', () => {
          openPlace(place);
        });

        item.appendChild(button);
        resultList.appendChild(item);
      });

      // 검색된 장소들이 지도에 보이도록 범위 조정
      if (places.length > 1) {
        map.setBounds(bounds);

      } else if (places.length === 1) {
        map.setCenter(
          new kakao.maps.LatLng(
            Number(places[0].y),
            Number(places[0].x)
          )
        );
      }
    }

    // 선택한 지역의 도서관 또는 공원 검색
    async function searchPlaces() {

      if (!map || !placesService) {
        return;
      }

      // 검색 번호 증가
      const thisSearch = ++searchVersion;

      // 기존 마커 및 목록 삭제
      clearPlaces();

      // 선택 버튼 갱신
      updateButtons();

      // 충전 유형에 따라 검색어 결정
      const keyword =
        activeType === 'library' ? '도서관' : '공원';

      // 고양시 전체이면 3개 구 모두 검색
      const targetDistricts =
        activeRegion === 'all'
          ? districts
          : [activeRegion];

      // 결과 저장용 배열
      const collected = [];

      // 중복 장소 제거용
      const knownIds = new Set();

      let failed = false;

      showEmpty('장소를 찾고 있습니다...');

      setStatus(
        (activeRegion === 'all'
          ? '고양시 전체'
          : activeRegion) +
        ' ' + keyword + ' 검색 중...'
      );

      // 행정구 하나의 장소 검색
      function searchOneDistrict(district) {

        return new Promise(resolve => {

          // 최대 3페이지까지 검색
          function searchPage(page) {

            // 이전 검색이면 종료
            if (thisSearch !== searchVersion) {
              resolve();
              return;
            }

            placesService.keywordSearch(
              '고양시 ' + district + ' ' + keyword,

              (data, status, pagination) => {

                if (thisSearch !== searchVersion) {
                  resolve();
                  return;
                }

                if (
                  status === kakao.maps.services.Status.OK
                ) {

                  data.forEach(place => {

                    // 선택한 행정구의 장소만 추가
                    if (getDistrict(place) !== district) {
                      return;
                    }

                    // 중복 장소인지 확인
                    const id = place.id || [
                      place.place_name,
                      place.x,
                      place.y
                    ].join('|');

                    if (!knownIds.has(id)) {
                      knownIds.add(id);
                      collected.push(place);
                    }
                  });

                  // 다음 페이지가 있으면 추가 검색
                  if (
                    page < 3 &&
                    pagination.hasNextPage
                  ) {
                    searchPage(page + 1);

                  } else {
                    resolve();
                  }

                } else {

                  if (
                    status !==
                    kakao.maps.services.Status.ZERO_RESULT
                  ) {
                    failed = true;
                  }

                  resolve();
                }
              },

              {
                size: 15,
                page: page,
                sort: kakao.maps.services.SortBy.ACCURACY
              }
            );
          }

          searchPage(1);
        });
      }

      // 선택한 행정구들을 차례로 검색
      for (const district of targetDistricts) {

        if (thisSearch !== searchVersion) {
          return;
        }

        await searchOneDistrict(district);
      }

      if (thisSearch !== searchVersion) {
        return;
      }

      // 행정구 및 장소 이름순으로 정렬
      collected.sort((a, b) => {

        const districtOrder =
          districts.indexOf(getDistrict(a)) -
          districts.indexOf(getDistrict(b));

        return (
          districtOrder ||
          a.place_name.localeCompare(b.place_name, 'ko')
        );
      });

      // 검색 결과 표시
      if (collected.length > 0) {

        displayPlaces(collected);

        setStatus(
          (activeRegion === 'all'
            ? '고양시 전체'
            : activeRegion) +
          ' ' + keyword + ' ' +
          collected.length +
          '곳을 찾았습니다.' +
          (failed
            ? ' 일부 검색은 완료되지 않았습니다.'
            : '')
        );

      } else {

        showEmpty(
          '검색된 장소가 없습니다. 다른 지역이나 유형을 선택해 보세요.'
        );

        setStatus(
          failed
            ? '장소 검색 중 오류가 발생했습니다.'
            : '검색 결과가 없습니다.'
        );
      }
    }

    // 현재 위치를 파란색 점으로 표시
    function showCurrentPosition(position) {

      if (currentOverlay) {
        currentOverlay.setMap(null);
      }

      const dot = document.createElement('div');

      dot.className = 'current-marker';
      dot.title = '내 현재 위치';

      currentOverlay = new kakao.maps.CustomOverlay({
        map: map,
        position: position,
        content: dot,
        zIndex: 5
      });
    }

    // 현재 위치 권한 요청
    function moveToMyLocation(isInitial = false) {

      if (!map) {
        return;
      }

      if (!navigator.geolocation) {

        if (isInitial) {
          searchPlaces();
        } else {
          setStatus(
            '브라우저에서 위치 기능을 지원하지 않습니다.'
          );
        }

        return;
      }

      const thisLocation = ++locationVersion;

      setStatus('현재 위치를 확인하고 있습니다...');

      navigator.geolocation.getCurrentPosition(

        // 위치 확인 성공
        position => {

          if (thisLocation !== locationVersion) {
            return;
          }

          currentPosition = new kakao.maps.LatLng(
            position.coords.latitude,
            position.coords.longitude
          );

          // 현재 위치 파란색 점 표시
          showCurrentPosition(currentPosition);

          if (isInitial) {

            // 최초 실행 시 현재 위치로 지도 이동
            map.setCenter(currentPosition);
            map.setLevel(5);

            // 기본 검색 실행
            searchPlaces();

          } else {

            map.panTo(currentPosition);
            map.setLevel(5);

            setStatus(
              '파란색 점이 현재 위치입니다. 지역 선택은 그대로 유지됩니다.'
            );
          }
        },

        // 위치 확인 실패
        error => {

          if (thisLocation !== locationVersion) {
            return;
          }

          if (isInitial) {
            searchPlaces();

          } else {
            setStatus(
              error.code === 1
                ? '위치 권한이 거부되었습니다.'
                : '현재 위치를 확인하지 못했습니다.'
            );
          }
        },

        {
          enableHighAccuracy: true,
          timeout: 12000,
          maximumAge: 60000
        }
      );
    }

    // 도서관 탭 클릭
    libraryTab.addEventListener('click', () => {
      activeType = 'library';
      searchPlaces();
    });

    // 공원 탭 클릭
    parkTab.addEventListener('click', () => {
      activeType = 'park';
      searchPlaces();
    });

    // 지역 버튼 클릭
    regionButtons.forEach(button => {

      button.addEventListener('click', () => {

        activeRegion = button.dataset.region;

        // 기존 결과를 삭제하고 선택 지역 재검색
        searchPlaces();
      });
    });

    // 내 위치 버튼 클릭
    locationButton.addEventListener('click', () => {
      moveToMyLocation(false);
    });

    // 카카오 SDK가 준비된 뒤 지도 실행
    if (
      window.kakao &&
      kakao.maps &&
      typeof kakao.maps.load === 'function'
    ) {

      kakao.maps.load(() => {

        // 장소 검색 라이브러리 확인
        if (
          !kakao.maps.services ||
          !kakao.maps.services.Places
        ) {
          setStatus(
            '장소 검색 라이브러리를 불러오지 못했습니다.'
          );
          return;
        }

        // 최초 지도 중심: 고양시 중심 부근
        map = new kakao.maps.Map(
          document.getElementById('map'),
          {
            center: new kakao.maps.LatLng(
              37.6584,
              126.8320
            ),
            level: 5
          }
        );

        // 장소 검색 서비스 생성
        placesService =
          new kakao.maps.services.Places();

        // 장소 정보창 생성
        infoWindow = new kakao.maps.InfoWindow({
          zIndex: 6,
          removable: true
        });

        // 모든 탭 활성화
        libraryTab.disabled = false;
        parkTab.disabled = false;

        regionButtons.forEach(button => {
          button.disabled = false;
        });

        locationButton.disabled = false;

        updateButtons();

        // 현재 위치 요청 및 기본 검색 실행
        moveToMyLocation(true);
      });

    } else {
      showSdkError();
    }
  </script>
</body>
</html>
